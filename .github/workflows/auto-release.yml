# DA-09 — PUBLISHER. DEFAULT-OFF UNTIL MAIN PROTECTION + ROLLBACK SIGNOFF.
# The read-only PR workflow has zero Cloudflare credentials.
# This workflow is triggered only by a completed release-security push-main run;
# even then it skips unless the repo administrator enables the release variable.
name: DraftAI protected automatic release
on:
  workflow_run:
    workflows:
      - DraftAI release security
    types:
      - completed
permissions:
  contents: read
  checks: read
concurrency:
  group: draftai-production-single-writer
  cancel-in-progress: false
jobs:
  publish-verified-css:
    name: protected-auto-release
    if: ${{ vars.DRAFTAI_AUTO_RELEASE_ENABLED == 'true' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == '07xh/engineering-drawing-study' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Checkout immutable main SHA, never a PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned public asset build dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Rebuild verified public site
        run: node scripts/build-static.cjs
      # The separate security-ci-gate step runs all 9 security suites exactly once.
      # Release-controller tests remain mandatory and run independently here.
      - name: Re-run release controller tests without production secrets
        run: node --test scripts/release/*.test.cjs
      - name: Verify release SHA-bound built assets before loading cloud secrets
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node tests/security/security-ci-gate.cjs
      - name: Verify protected main, upload immutable version, publish and roll back on failure
        env:
          DRAFTAI_AUTO_RELEASE_ENABLED: ${{ vars.DRAFTAI_AUTO_RELEASE_ENABLED }}
          DRAFTAI_TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          DRAFTAI_PRODUCTION_ORIGIN: ${{ vars.DRAFTAI_PRODUCTION_ORIGIN }}
          DRAFTAI_PRODUCTION_HOST: ${{ vars.DRAFTAI_PRODUCTION_HOST }}
          DRAFTAI_BOOTSTRAP_ACTIVE_VERSION: ${{ vars.DRAFTAI_BOOTSTRAP_ACTIVE_VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release/protected-release.cjs
