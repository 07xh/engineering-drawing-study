name: C1 real OCCT native gap identity forensics

on:
  pull_request:
    paths:
      - 'workbench/c1-joint-native-gap-evidence.cjs'
      - 'tests/workbench/c1-joint-native-gap-evidence.test.cjs'
      - 'tests/cad/test_c1_native_gap_topods_identity.py'
      - '.github/workflows/c1-native-gap-forensics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-native-c1-gap:
    name: real-native-c1-gap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual pinned OCCT native bindings (not mock)
        run: |
          python -m pip install --only-binary=:all: 'cadquery-ocp==7.9.3.1.1'
      - name: Require actual BRep/HLR native identity counterexamples
        run: python -m unittest -v tests/cad/test_c1_native_gap_topods_identity.py
      - name: Run complete joint gap audit regressions
        run: node --test tests/workbench/c1-joint-native-gap-evidence.test.cjs
