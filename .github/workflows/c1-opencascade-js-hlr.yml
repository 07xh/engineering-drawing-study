permissions:
  contents: read

concurrency:
  group: c1-opencascade-js-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  real-wasm-hlr:
    name: real-wasm-hlr
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert exact original convex face-ray proof and adversarial cases without external CAD
        run: |
          set -euo pipefail
          node --test tests/math/m0-exact-convex-incident-source-open-ray.test.cjs
          node --test tests/workbench/c1-m5-exact-original-vertex-rays.test.cjs
          node --test tests/workbench/c1-m5-closed-original-edge-ray-continuity.test.cjs
          node --test tests/workbench/c1-m5-original-closed-vertex-stars.test.cjs
          node --test tests/workbench/c1-ocjs-3d-candidate-lift.test.cjs
          node --test tests/workbench/c1-ocjs-original-brep-source-xyz.test.cjs
          node --test tests/workbench/c1-ocjs-original-curve-type.test.cjs
          node --test tests/workbench/c1-ocjs-hlr-output-curve-witness.test.cjs
          node --test tests/workbench/c1-ocjs-hidden-sharp-hlr.test.cjs
          node --test tests/workbench/c1-ocjs-hidden-sharp-m5-corroboration.test.cjs
          node --test tests/workbench/c1-native-hidden-exact-source-pruning.test.cjs
          node --test tests/workbench/c1-native-hidden-3d-endpoint-fan-junctions.test.cjs
          node --test tests/workbench/c1-native-hidden-whole-source-interval-closure.test.cjs
          node --test tests/workbench/c1-native-hidden-front-visible-mask.test.cjs
          node --test tests/workbench/c1-native-hidden-dual-proof-open-interval-union.test.cjs
          node --test tests/workbench/c1-native-hidden-exact-model-front-mask.test.cjs
      - name: Install isolated pinned JavaScript/WASM CAD, never into production bundle
        env:
          PROBE_ROOT: ${{ runner.temp }}/draftai-ocjs-test
        run: |
          mkdir -p "$PROBE_ROOT"
          npm install --prefix "$PROBE_ROOT" --ignore-scripts --no-save --no-package-lock \
            --omit=optional --no-audit --no-fund \
            opencascade.js@2.0.0-beta.b5ff984 ws@8.18.3
      - name: Run actual HLR B-Rep / first-angle JS WebAssembly with bounded memory
        env:
          PROBE_ROOT: ${{ runner.temp }}/draftai-ocjs-test
          REPORT: ${{ runner.temp }}/draftai-c1-real-ocjs-hlr.json
        run: |
          set -euo pipefail
          node --max-old-space-size=4096 \
            tools/cad-oracle/probe-opencascade-js-hlr.mjs "$PROBE_ROOT" | tee "$REPORT"
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.schema!=="draftai-c1-opencascade-js-real-wasm-hlr-probe/1"||!["V","H","W"].every(v=>r.views[v]?.visibleBRepEdgeCount>=4))process.exit(1)' "$REPORT"
      - name: Compute THREE cuboid and TWO generic convex actual C1 CAD problems under authoritative M5 and one V5
        env:
          PROBE_ROOT: ${{ runner.temp }}/draftai-ocjs-test
          REPORT: ${{ runner.temp }}/draftai-c1-real-ocjs-consumer.json
        run: |
          set -euo pipefail
          node --max-old-space-size=4096 \
            tools/cad-oracle/run-c1-ocjs-runtime.mjs "$PROBE_ROOT" | tee "$REPORT"
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.schema!=="draftai-c1-ocjs-runtime-compute-m5-consumer/1"||r.computationalConsumers!==3||r.genericConvexWasmConsumers!==2||!r.polyhedra.some(x=>x.physicalFeatureEvidence?.localExactOutwardCADVisible>=1)||!r.polyhedra.every(x=>x.physicalFeatureEvidence?.formalSignedCount===0&&x.physicalFeatureEvidence?.CADSourceConflicts===0&&x.physicalFeatureEvidence?.originalSourceM4Events>0&&x.physicalFeatureEvidence?.sourceBoundProjectedSubintervals>0&&x.physicalFeatureEvidence?.original3DVertexEndpointEvidenceCount>0&&x.physicalFeatureEvidence?.originalPaperUnresolvedAliasCount>=0&&x.physicalFeatureEvidence?.originalPaperPairDepthProofCount>=0&&x.physicalFeatureEvidence?.originalPaperExact3DDuplicateCount===0&&x.physicalFeatureEvidence?.finalSourceObligations?.total===x.physicalFeatureEvidence?.sourceBoundProjectedSubintervals&&x.physicalFeatureEvidence?.provenExactHiddenEliminationsYieldUniqueOriginalSource>=0&&x.physicalFeatureEvidence?.actualRealCADMultipleRawSourceAliasSubspans>=0&&x.physicalFeatureEvidence?.finalSourceObligations?.signedNewV5===0&&x.physicalFeatureEvidence?.finalSourceObligations?.genuineOriginal3DVertexFaceFanViewStars>0&&x.physicalFeatureEvidence?.finalSourceObligations?.realOriginal3DVertexFaceFanEndpointProofs>=0&&x.physicalFeatureEvidence?.finalSourceObligations?.genuineOriginalVertexWholeRayClearEndpoints>=0&&x.physicalFeatureEvidence?.finalSourceObligations?.exactWholeClosedOriginalPhysicalEdgeViews>=0&&x.physicalFeatureEvidence?.finalSourceObligations?.originalSourceCut3DJoinedWithoutPaperVertexPromotion>=0&&x.physicalFeatureEvidence?.finalSourceObligations?.paperOnlyCutEndpointsNeverUpgraded>=0&&x.physicalFeatureEvidence?.certifiedSameOriginal3DEdgeCutJoins>=0&&x.physicalFeatureEvidence?.originalSourcePairDepthOverlapCount===x.physicalFeatureEvidence?.originalSourceStrictAffineFrontCount+x.physicalFeatureEvidence?.originalSourceUnresolvedPairDepthCount&&x.physicalFeatureEvidence?.sourceBoundProjectedSubintervals===x.physicalFeatureEvidence?.actualSingleOpaqueSourceClearSubspans+x.physicalFeatureEvidence?.actualSingleOpaqueSourceStrictHiddenSubspans+x.physicalFeatureEvidence?.actualSingleOpaqueSourceUnknownSubspans+x.physicalFeatureEvidence?.originalM5ExteriorHeldSubspans)||!r.polyhedra.every(x=>x.m5Signed===true&&x.uniqueV5===true&&x.m5GlobalSignedGate===true&&x.m5Unresolved===0&&x.cadM5Conflicts===0&&x.cadM5Corroborated===x.scopedOfficialVisibleContourLines&&x.scopedOfficialVisibleContourLines>=9)||!r.originalM5AuthorityPreserved||r.extraV5Players!==0)process.exit(1)' "$REPORT"
      - name: Preserve M5-gated actual computed C1 consumer evidence
        uses: actions/upload-artifact@v4
        with:
          name: c1-ocjs-computed-scoped-M5-V5-evidence
          path: ${{ runner.temp }}/draftai-c1-real-ocjs-consumer.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve non-authoritative WASM API proof and timings
        uses: actions/upload-artifact@v4
        with:
          name: isolated-c1-ocjs-real-wasm-api-proof
          path: ${{ runner.temp }}/draftai-c1-real-ocjs-hlr.json
          if-no-files-found: error
          retention-days: 14
