name: DraftAI isolated OpenCascade.js C1 HLR ABI

on:
  pull_request:
    paths:
      - 'tools/cad-oracle/probe-opencascade-js-hlr.mjs'
      - 'tools/cad-oracle/run-c1-ocjs-runtime.mjs'
      - 'engines/spatial/hlr/c1-ocjs-visible-strokes.cjs'
      - 'workbench/c1-ocjs-reviewed-solid-v5.cjs'
      - 'tests/workbench/c1-ocjs-m5-source-coverage.test.cjs'
      - '.github/workflows/c1-opencascade-js-hlr.yml'
  push:
    branches: [main]
    paths:
      - 'tools/cad-oracle/probe-opencascade-js-hlr.mjs'
      - 'tools/cad-oracle/run-c1-ocjs-runtime.mjs'
      - 'engines/spatial/hlr/c1-ocjs-visible-strokes.cjs'
      - 'workbench/c1-ocjs-reviewed-solid-v5.cjs'
      - 'tests/workbench/c1-ocjs-m5-source-coverage.test.cjs'
      - '.github/workflows/c1-opencascade-js-hlr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c1-opencascade-js-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  real-wasm-hlr:
    name: real-wasm-hlr
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated pinned JavaScript/WASM CAD, never into production bundle
        env:
          PROBE_ROOT: ${{ runner.temp }}/draftai-ocjs-test
        run: |
          mkdir -p "$PROBE_ROOT"
          npm install --prefix "$PROBE_ROOT" --ignore-scripts --no-save --no-package-lock \
            --omit=optional --no-audit --no-fund \
            opencascade.js@2.0.0-beta.b5ff984 ws@8.18.3
      - name: Run actual HLR B-Rep / first-angle JS WebAssembly with bounded memory
        env:
          PROBE_ROOT: ${{ runner.temp }}/draftai-ocjs-test
          REPORT: ${{ runner.temp }}/draftai-c1-real-ocjs-hlr.json
        run: |
          set -euo pipefail
          node --max-old-space-size=4096 \
            tools/cad-oracle/probe-opencascade-js-hlr.mjs "$PROBE_ROOT" | tee "$REPORT"
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.schema!=="draftai-c1-opencascade-js-real-wasm-hlr-probe/1"||!["V","H","W"].every(v=>r.views[v]?.visibleBRepEdgeCount>=4))process.exit(1)' "$REPORT"
      - name: Compute THREE actual reviewed cuboid C1 problems with OCJS and certify only through existing M5/V5
        env:
          PROBE_ROOT: ${{ runner.temp }}/draftai-ocjs-test
          REPORT: ${{ runner.temp }}/draftai-c1-real-ocjs-consumer.json
        run: |
          set -euo pipefail
          node --max-old-space-size=4096 \
            tools/cad-oracle/run-c1-ocjs-runtime.mjs "$PROBE_ROOT" | tee "$REPORT"
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(r.schema!=="draftai-c1-ocjs-runtime-compute-m5-consumer/1"||r.computationalConsumers!==3||r.genericConvexWasmConsumers!==2||!r.polyhedra.every(x=>x.m5Signed&&x.uniqueV5&&x.scopedOfficialVisibleContourLines>=9)||!r.originalM5AuthorityPreserved||r.extraV5Players!==0)process.exit(1)' "$REPORT"
      - name: Preserve M5-gated actual computed C1 consumer evidence
        uses: actions/upload-artifact@v4
        with:
          name: c1-ocjs-computed-scoped-M5-V5-evidence
          path: ${{ runner.temp }}/draftai-c1-real-ocjs-consumer.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve non-authoritative WASM API proof and timings
        uses: actions/upload-artifact@v4
        with:
          name: isolated-c1-ocjs-real-wasm-api-proof
          path: ${{ runner.temp }}/draftai-c1-real-ocjs-hlr.json
          if-no-files-found: error
          retention-days: 14
