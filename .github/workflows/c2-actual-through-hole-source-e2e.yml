name: C2 real through-hole OpenCascade source-to-M4

on:
  pull_request:
    paths:
      - 'tools/c2_occt_boolean_history_reference.py'
      - 'tools/c2_native_m0_m4_m5_proof_pack.cjs'
      - 'core/numeric/axis-box-source-open-ray.cjs'
      - 'tests/math/m0-axis-box-subtractive-open-ray.test.cjs'
      - 'workbench/c2-native-occt-generated-ray-m5.cjs'
      - 'workbench/c2-native-generated-global-m4-m5.cjs'
      - 'tests/workbench/c2-native-through-hole-m0-m4-topology.test.cjs'
      - 'tests/ui/c2-native-cut-review-ui.test.cjs'
      - 'labs/c2-native-cut-review-ui.js'
      - 'labs/c2-native-cut-review-entry.cjs'
      - 'labs/c2-native-cut-certified-demo.json'
      - 'scripts/extract-public-c2-certified-cut-snapshot.cjs'
      - 'tests/fixtures/c2-rectangular-through-hole-two-boxes-occt.json'
      - '.github/workflows/c2-actual-through-hole-source-e2e.yml'
  push:
    branches: [main, 'feat/c2-*']
    paths:
      - 'tools/c2_occt_boolean_history_reference.py'
      - 'tools/c2_native_m0_m4_m5_proof_pack.cjs'
      - 'core/numeric/axis-box-source-open-ray.cjs'
      - 'tests/math/m0-axis-box-subtractive-open-ray.test.cjs'
      - 'workbench/c2-native-occt-generated-ray-m5.cjs'
      - 'workbench/c2-native-generated-global-m4-m5.cjs'
      - 'tests/workbench/c2-native-through-hole-m0-m4-topology.test.cjs'
      - 'tests/ui/c2-native-cut-review-ui.test.cjs'
      - 'labs/c2-native-cut-review-ui.js'
      - 'labs/c2-native-cut-review-entry.cjs'
      - 'labs/c2-native-cut-certified-demo.json'
      - 'scripts/extract-public-c2-certified-cut-snapshot.cjs'
      - 'tests/fixtures/c2-rectangular-through-hole-two-boxes-occt.json'
      - '.github/workflows/c2-actual-through-hole-source-e2e.yml'

permissions:
  contents: read

jobs:
  genuine-subtractive-c2-native-m4:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DRAFTAI_REQUIRE_NATIVE_OCCT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned mature OpenCascade, never mock the CAD kernel
        run: |
          python -m pip install --only-binary=:all: 'cadquery-ocp==7.9.3.1.1'
      - name: Prove actual BRepAlgoAPI_Cut 24-edge solid through-hole and original M4
        run: node --test tests/workbench/c2-native-through-hole-m0-m4-topology.test.cjs
      - name: Produce inspectable true native cut and 3D/2D source output
        run: |
          python tools/c2_occt_boolean_history_reference.py \
            tests/fixtures/c2-rectangular-through-hole-two-boxes-occt.json \
            --output original-c2-through-hole-topods.json
          node tools/c2_native_m0_m4_m5_proof_pack.cjs \
            tests/fixtures/c2-rectangular-through-hole-two-boxes-occt.json \
            original-c2-through-hole-m0-m4.json
      - name: Require partial-only, 12 truly signed and 40 held original Cut intervals
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const p=JSON.parse(fs.readFileSync('original-c2-through-hole-m0-m4.json','utf8'));
          const c=p.sourceCertifiedNativeCanonicalPartialCutV5;
          assert.equal(p.booleanOperation,'cut');
          assert.equal(p.provenance.actualNativeOpenCascadeRanInThisProcessTree,true);
          assert.equal(p.completeCutProjectOfficialGBLineStylesAndV5Certified,false);
          assert.equal(p.ConstructionIntentDAGSingleV5FullySigned,false);
          assert.equal(p.sourceCertifiedNativeCanonicalV5,null);
          assert.equal(c.entireCutOriginalDrawingSigned,false);
          assert.equal(c.oneExistingV5TimelineRecreated,true);
          assert.equal(c.certifiedVisibleHiddenSourceIntervals.length,12);
          assert.equal(c.suppressedNativeBackSourceIntervals.length,12);
          assert.equal(c.unsignedNativePhysicalSourceIntervals.length,40);
          assert.equal(fs.existsSync('original-c2-through-hole-m0-m4.signed-only.svg'),true);
          JS
      - name: Require embedded public one-tap C2 preview to match freshly signed real OCCT
        run: |
          node scripts/extract-public-c2-certified-cut-snapshot.cjs --verify \
            original-c2-through-hole-m0-m4.json labs/c2-native-cut-certified-demo.json
      - name: Install pinned web DOM test dependencies for genuine proof importer
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Re-import SAME-RUN genuine native Cut JSON in the deployed mobile proof UI and sole V5
        env:
          DRAFTAI_REAL_C2_NATIVE_PROOF_PACK: original-c2-through-hole-m0-m4.json
        run: node --test tests/ui/c2-native-cut-review-ui.test.cjs
      - name: Keep generated original Cut proof, certified-only SVG and native TopoDS for local mobile review
        uses: actions/upload-artifact@v4
        with:
          name: genuine-c2-rectangular-through-hole-topods
          path: |
            original-c2-through-hole-topods.json
            original-c2-through-hole-m0-m4.json
            original-c2-through-hole-m0-m4.signed-only.svg
          if-no-files-found: error
          retention-days: 14
