name: Validate study site
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check content.js
          node --check scripts/check-constraints.cjs
          node --check labs/constraint-engine.js
          node --check labs/constraint-explorer.js
          node --check labs/teaching-steps.js
          node --check labs/line-projection.js
          node --check labs/method-library.js
          node --check knowledge/knowledge-data.js
          node --check knowledge/knowledge-app.js
          node --check scripts/check-knowledge.cjs
          node --check scripts/check-ui-layout.cjs
          node --check scripts/check-knowledge-ui.cjs
          node --check knowledge/visual-model.js
          node --check knowledge/visual-ui.js
          node --check knowledge/research-core.js
          node --check knowledge/research-ui.js
          node --check knowledge/solution-gate.js
          node --check labs/verified-solutions.js
          node --check labs/source-inspector.js
          node --check labs/source-inspector-ui.js
          node --check labs/source-fidelity-audit.js
          node --check labs/exercise-261-evidence.js
          node --check labs/exercise-261-ui.js
          node --check scripts/check-exercise-261.cjs
          node --check labs/source-fidelity-ui.js
          node --check labs/point-construction-core.js
          node --check labs/point-construction-ui.js
          node --check labs/tangent-constraint-core.js
          node --check labs/tangent-constraint-ui.js
          node --check scripts/check-tangent-constraint.cjs
          node --check scripts/check-fidelity-construction.cjs
          node --check scripts/check-source-inspector.cjs
          node --check scripts/check-visual-research.cjs
          node --check scripts/check-method-library.cjs
          node --check labs/line-workbench-layout.js
          node --check scripts/check-line-projection.cjs
          node --check question-strategies.js
          node --check scripts/check-question-strategies.cjs
          node --check scripts/check-constraint-engine.cjs
      - name: Validate lessons and questions
        run: |
          node scripts/validate.cjs
          node scripts/check-constraints.cjs
          node scripts/check-lab-page.cjs
          node scripts/check-k-drag.cjs
          node scripts/check-constraint-engine.cjs
          node scripts/check-explorer.cjs
          node scripts/check-line-projection.cjs
          node scripts/check-method-library.cjs
          node scripts/check-knowledge.cjs
          node scripts/check-ui-layout.cjs
          node scripts/check-knowledge-ui.cjs
          node scripts/check-visual-research.cjs
          node scripts/check-source-inspector.cjs
          node scripts/check-fidelity-construction.cjs
          node scripts/check-tangent-constraint.cjs
          node scripts/check-exercise-261.cjs
          node scripts/check-workbench-layout.cjs
          node scripts/check-question-strategies.cjs
          node scripts/build-static.cjs
          test -f dist/labs/constraints.html
          test -f dist/labs/analysis.html
          test -f dist/labs/constraint-engine.js
          test -f dist/labs/constraint-explorer.js
          test -f dist/labs/teaching-steps.js
          test -f dist/labs/line-projection.html
          test -f dist/labs/line-projection.js
          test -f dist/labs/method-library.js
          test -f dist/site-ui.css
          test -f dist/knowledge/index.html
          test -f dist/knowledge/knowledge-ui.css
          test -f dist/knowledge/knowledge-data.js
          test -f dist/knowledge/knowledge-app.js
          test -f dist/knowledge/visual-model.js
          test -f dist/knowledge/visual-ui.js
          test -f dist/knowledge/research-core.js
          test -f dist/knowledge/research-ui.js
          test -f dist/knowledge/solution-gate.js
          test -f dist/labs/verified-solutions.js
          test -f dist/labs/source-inspector.js
          test -f dist/labs/source-inspector-ui.js
          test -f dist/labs/source-fidelity.html
          test -f dist/labs/exercise-261-evidence.js
          test -f dist/labs/exercise-261-ui.js
          test -f dist/labs/source-fidelity-audit.js
          test -f dist/labs/source-fidelity-ui.js
          test -f dist/labs/point-construction.html
          test -f dist/labs/point-construction-core.js
          test -f dist/labs/point-construction-ui.js
          test -f dist/labs/tangent-constraint.html
          test -f dist/labs/tangent-constraint-core.js
          test -f dist/labs/tangent-constraint-ui.js
          test -f dist/labs/line-workbench-layout.js
          test -f dist/question-strategies.js
