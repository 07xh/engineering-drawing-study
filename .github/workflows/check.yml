name: Validate study site
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned WebGL build dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check scripts/check-constraints.cjs
          node --check labs/constraint-engine.js
          node --check labs/dof-lab-geometry.js
          node --check labs/free-geometry-core.js
          node --check labs/free-geometry-sheet.js
          node --check labs/free-geometry-spatial-svg.js
          node --check labs/free-modeler-ui.js
          node --check labs/dof-lab-sheet.js
          node --check labs/dof-lab-visibility.js
          node --check labs/dof-lab-state.js
          node --check labs/dof-lab-spatial-svg.js
          node --check labs/dof-lab-v2-ui.js
          node --check labs/constraint-explorer.js
          node --check labs/teaching-steps.js
          node --check labs/method-library.js
          node --check knowledge/knowledge-data.js
          node --check knowledge/lesson-depth.js
          node --check knowledge/six-layer-course.js
          node --check knowledge/textbook-page-audit.js
          node --check knowledge/textbook-page-audit-ui.js
          node --check knowledge/textbook-concept-motion.js
          node --check knowledge/textbook-concept-motion-ui.js
          node --check scripts/check-textbook-concept-motion.cjs
          node --check scripts/check-textbook-page-audit.cjs
          node --check knowledge/textbook-examples.js
          node --check knowledge/textbook-example-geometry.js
          node --check knowledge/textbook-example-ui.js
          node --check knowledge/textbook-shape-inspector.js
          node --check knowledge/textbook-constraint-visual.js
          node --check knowledge/textbook-constraint-visual-ui.js
          node --check scripts/check-textbook-examples.cjs
          node --check scripts/check-textbook-shape-inspector.cjs
