name: Validate study site
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check scripts/check-constraints.cjs
          node --check labs/constraint-engine.js
          node --check labs/constraint-explorer.js
          node --check labs/teaching-steps.js
          node --check labs/method-library.js
          node --check knowledge/knowledge-data.js
          node --check knowledge/lesson-depth.js
          node --check knowledge/textbook-examples.js
          node --check knowledge/textbook-example-geometry.js
          node --check knowledge/textbook-example-ui.js
          node --check scripts/check-textbook-examples.cjs
          node --check scripts/check-textbook-only.cjs
          node --check scripts/check-exercise-source-gate.cjs
          node --check knowledge/knowledge-app.js
          node --check scripts/check-knowledge.cjs
          node --check scripts/check-ui-layout.cjs
          node --check scripts/check-knowledge-ui.cjs
          node --check knowledge/visual-model.js
          node --check knowledge/visual-ui.js
          node --check knowledge/research-core.js
          node --check knowledge/research-ui.js
          node --check knowledge/solution-gate.js
          node --check labs/verified-solutions.js
          node --check labs/source-inspector.js
          node --check labs/source-inspector-ui.js
          node --check labs/source-fidelity-audit.js
          node --check labs/exercise-261-evidence.js
          node --check labs/exercise-261-ui.js
          node --check scripts/check-exercise-261.cjs
          node --check labs/source-fidelity-ui.js
          node --check labs/point-construction-core.js
          node --check labs/point-construction-ui.js
          node --check labs/tangent-constraint-core.js
          node --check labs/tangent-constraint-ui.js
          node --check scripts/check-tangent-constraint.cjs
          node --check labs/paper-geometry-core.js
          node --check labs/paper-geometry-ui.js
          node --check labs/composite-geometry-core.js
          node --check labs/composite-geometry-ui.js
          node --check scripts/check-composite-geometry.cjs
          node --check scripts/check-paper-geometry.cjs
          node --check scripts/check-fidelity-construction.cjs
          node --check scripts/check-source-inspector.cjs
          node --check scripts/check-visual-research.cjs
          node --check scripts/check-method-library.cjs
          node --check scripts/check-constraint-engine.cjs
      - name: Validate lessons and questions
        run: |
          node scripts/check-constraints.cjs
          node scripts/check-constraint-engine.cjs
          node scripts/check-explorer.cjs
          node scripts/check-method-library.cjs
          node scripts/check-knowledge.cjs
          node scripts/check-textbook-only.cjs
          node scripts/check-exercise-source-gate.cjs
          node scripts/check-textbook-examples.cjs
          node scripts/check-animation-workspace.cjs
          node scripts/check-ui-layout.cjs
          node scripts/check-knowledge-ui.cjs
          node scripts/check-lesson-stage-mapping.cjs
          node scripts/check-visual-construction-explanations.cjs
          node scripts/check-projection-guide-alignment.cjs
          node scripts/check-projection-point-labels.cjs
          node scripts/check-projection-label-layout.cjs
          node scripts/check-projection-stage-highlights.cjs
          node scripts/check-projection-stage-reasons.cjs
          node scripts/check-projection-constraint-lessons.cjs
          node scripts/check-problem-schema.cjs
          node scripts/check-drawing-action-renderer.cjs
          node scripts/check-drawing-player.cjs
          node scripts/check-textbook-action-adapter.cjs
          node scripts/check-textbook-player-links.cjs
          node scripts/check-drawing-line-styles.cjs
          node scripts/check-drawing-step-highlight.cjs
          node scripts/check-drawing-arc-dimension.cjs
          node scripts/check-drawing-dimension-extensions.cjs
          node scripts/check-textbook-player-reasons.cjs
          node scripts/check-constraint-step-trace.cjs
          node scripts/check-planar-point-constraints.cjs
          node scripts/check-planar-intersections.cjs
          node scripts/check-unified-constraint-analysis.cjs
          node scripts/check-geometry-dependency-graph.cjs
          node scripts/check-construction-verifier.cjs
          node scripts/check-intersection-candidate-filter.cjs
          node scripts/check-construction-criteria.cjs
          node scripts/check-player-constraint-panel.cjs
          node scripts/check-example-2-2-computed-dof.cjs
          node scripts/check-multi-point-constraints.cjs
          node scripts/check-nonlinear-local-dof.cjs
          node scripts/check-nonlinear-angle.cjs
          node scripts/check-tangency-analysis.cjs
          node scripts/check-tangency-local-dof.cjs
          node scripts/check-nonlinear-step-trace.cjs
          node scripts/check-player-local-dof.cjs
