          node scripts/check-composite-geometry.cjs
          node scripts/check-exercise-261.cjs
          node scripts/build-static.cjs
          node scripts/check-static-site-dependencies.cjs
          test -f dist/index.html
          test -f dist/public-use.html
          test -f dist/labs/point-coach.html
          test -f dist/labs/free-modeler.html
          test -f dist/labs/dof-lab-v2.html
          test -f dist/labs/tangent-constraint.html
          test ! -e dist/knowledge/index.html
          test ! -e dist/labs/verified-exercises.js
