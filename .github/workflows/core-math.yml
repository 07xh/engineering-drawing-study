# 09 | Always-on, read-only core math gate.
# This workflow must run for EVERY PR and every main push so that GitHub
# can safely require the stable `math` check without path-filter deadlocks.
name: DA-ARCH-001 core mathematics

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: core-math-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  math:
    name: math
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate all core JavaScript syntax (including .cjs)
        run: |
          find core -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -r -n1 node --check

      - name: Run all core mathematical contract and boundary tests
        run: node --test tests/math/*.test.cjs
