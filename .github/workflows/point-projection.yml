name: DraftAI point projection checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  point-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual 3-view solver with mathematical negative cases
        run: node --test tests/projection/*.test.cjs
