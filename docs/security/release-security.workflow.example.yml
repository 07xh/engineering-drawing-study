# DA-09-REL-AUTO-001 - REVIEW ONLY. This file is not active under docs/.
# After 00 grants the .github/workflows/** file lock, copy to
# .github/workflows/release-security.yml in an independently reviewed PR.
# No deployment credentials, Cloudflare operations, merge or auto-approval.
name: DraftAI release security
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  release-security:
    name: release-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build the public site
        run: node scripts/build-static.cjs
      - name: Run all offline security tests and audit public dist
        run: node tests/security/security-ci-gate.cjs
