</style></head><body><div class="wrap"><nav><a href="./index.html">← 返回教材知识库</a></nav><main><h1>通用作图动作播放器</h1><p class="note">本课堂仅展示已核验教材例题，采用<strong>归一化重绘步骤</strong>，不包含出版社原图，不能代替原版图纸。</p><label for="problemSelect">选择已核验教材例题：</label> <select id="problemSelect"><option value="example-1-1">教材例 1-1 · 直线 AB 七等分</option><option value="example-2-2">教材例 2-2 · 两面投影求第三面投影</option></select><p id="sourceDescription"></p><h2 id="problemTitle">正在载入…</h2><div class="lesson-layout"><div class="lesson-visual"><svg id="drawingBoard" viewBox="0 0 820 440" role="img" aria-label="逐步绘制的点线圆演示"></svg><div class="controls"><button id="previous" type="button">上一步</button><span id="counter" aria-live="polite"></span><label><input type="checkbox" id="showAuxiliary" checked> 显示辅助线</label><label><input type="checkbox" id="highlightStep" checked> 高亮本步新增图形</label><button id="next" type="button">下一步</button></div></div><aside class="lesson-explanation" aria-label="本步作图解释"><h3>本步作图</h3><p id="reason" aria-live="polite"></p><h3>为什么这样作图</h3><p id="why" aria-live="polite"></p><h3>约束与自由度</h3><div class="step-dof" id="computedDof" hidden><strong id="computedDofValue"></strong><small id="computedDofLabel"></small></div><p id="freedom" aria-live="polite"></p><p id="constraintReason" aria-live="polite"></p><h3>本步检查</h3><p id="stageCheck" aria-live="polite"></p><details aria-label="数学约束核验结果"><summary>展开数学计算与核验详情</summary><h3>数学引擎核验</h3><p id="mathVerification" aria-live="polite">尚未提供可计算的结构化约束。</p><h3>多点局部自由度追踪</h3><p id="localDofVerification" aria-live="polite">尚未提供可计算的多点非线性约束。</p></details></aside></div><p id="status" role="status"></p></main></div>
