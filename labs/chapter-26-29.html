<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf3ef"><title>第 2-6～2-9 节 · 章节练习导航 | 图学课堂</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#22392f;background:#edf3ef}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}a{color:#206c58}h1{font-size:clamp(24px,4vw,34px)}p{line-height:1.8}.hero,.card{background:#fff;border:1px solid #d8e6dd;border-radius:16px;padding:20px;margin:14px 0}.tag{display:inline-block;border-radius:99px;background:#eaf5ef;color:#26634e;padding:5px 12px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{margin:0}.card h3{margin:4px 0 10px}.card small{color:#64786b}.card a{display:inline-block;margin-top:10px}.notice{border-left:4px solid #c28b35;padding:10px 14px;background:#fffaf0;border-radius:8px}.count{color:#64786b}.button{display:inline-block;padding:11px 16px;border-radius:10px;background:#206c58;color:white;text-decoration:none;min-height:44px}button{font:inherit;min-height:44px;padding:8px 12px;border:1px solid #adcbb9;background:white;border-radius:9px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #d49d42}.card.done{border-color:#64a883}.card.done h3:after{content:" ✓";color:#18744e}.muted{font-size:13px;color:#687a70}footer{padding:25px 0;color:#627569}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}.filters input,.filters select{font:inherit;min-height:44px;padding:10px;border:1px solid #adcbb9;border-radius:9px;background:white}.filters input{flex:2;min-width:180px}.filters select{flex:1;min-width:135px}.card[hidden],h2[hidden]{display:none}.empty{padding:16px;color:#65766b;background:white;border-radius:10px}
</style></head><body><main class="wrap"><p><a href="../index.html">← 返回图学课堂首页</a></p><header class="hero"><span class="tag">第二章 · 扫描教材对应章节</span><h1>第 2-6～2-9 节 · 章节练习导航</h1><p>按已提供的教材扫描页整理题号与主题，配套独立编写的知识点提示，帮助安排纸面作图。<strong>这里不是教材原文、原图或标准答案</strong>；浅色透印、纸张阴影不作为题目线条。</p><p class="notice">目前发布的是章节索引和自主学习提示。图形尚未逐题精确数字化，遇到尺寸、虚线或原图条件，请以手中的教材为准。</p><p id="summary" class="count" aria-live="polite"></p><button id="reset">清空本机标记</button></header><div class="filters" role="search" aria-label="筛选习题"><input id="search" type="search" placeholder="搜索题号或知识点，例如 2-8-3、棱锥" aria-label="搜索题目"><select id="chapterFilter" aria-label="按章节筛选"><option value="all">全部章节</option><option value="2-6">2-6 平面</option><option value="2-7">2-7 平面上的点线</option><option value="2-8">2-8 棱柱与棱锥</option><option value="2-9">2-9 曲面立体</option></select><select id="reviewFilter" aria-label="按复习状态筛选"><option value="all">全部状态</option><option value="todo">未复习</option><option value="done">已复习</option></select></div><p id="visibleCount" class="count" aria-live="polite"></p><p id="empty" class="empty" hidden>没有符合条件的习题，请更改搜索或筛选条件。</p><div class="grid" id="cards"></div><footer>图学课堂 · 本机学习标记仅保存在当前浏览器，不上传服务器。 · <a href="line-projection.html">直线投影交互工作台</a></footer></main><script>
(function(){'use strict';const sections=[
{section:'2-6',title:'平面上的第三面投影',items:[['2-6-1','由两个已知投影，分析并补画第三面投影。'],['2-6-2','根据已知图形的两个投影，补全其余投影。'],['2-6-3','观察投影轴与点的位置，建立三面投影对应关系。'],['2-6-4','分析带斜边平面图形的空间位置与第三面投影。'],['2-6-5','检查多边形各顶点在三面投影中的对应关系。'],['2-6-6','结合倾斜图形，核对宽相等与高平齐。']]},
{section:'2-7',title:'平面直线和点的投影',items:[['2-7-1','判断点与平面的关系，并求其余投影。'],['2-7-2','分析已知平面内直线的投影关系。'],['2-7-3','由已知平面投影补全相关投影。'],['2-7-4','利用平面内已知线与点的投影约束作图。'],['2-7-5','练习在给定平面内构造指定位置的直线。'],['2-7-6','结合已知平面和边线，补画符合约束的投影。']]},
{section:'2-8',title:'棱柱、棱锥等立体投影',items:[['2-8-1','补画正六棱柱的左视图。'],['2-8-2','补画正三棱柱的左视图。'],['2-8-3','补画正三棱锥的左视图。'],['2-8-4','补画三棱体的俯视图。'],['2-8-5','补画正五棱柱的左视图。'],['2-8-6','补画正三棱柱的左视图。'],['2-8-7','分析棱锥面上指定点的投影。'],['2-8-8','分析棱台或锥体表面指定点的投影。']]},
{section:'2-9',title:'圆柱、圆锥、圆球与表面点',items:[['2-9-1','补画不完整的第三视图。'],['2-9-2','补画带切割特征的圆柱相关视图。'],['2-9-3','利用辅助线法确定圆锥表面点的投影。'],['2-9-4','利用辅助平面法确定圆锥表面点的投影。'],['2-9-5','求圆柱表面指定点的投影。'],['2-9-6','求圆锥表面指定点的投影。'],['2-9-7','求球面上指定点的其余投影。'],['2-9-8','求球面上指定点的其余投影。']]}
];const key='drawing-chapter-index-reviewed-v1';let done=new Set();try{const a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a))done=new Set(a.filter(x=>sections.some(s=>s.items.some(i=>i[0]===x))))}catch(e){}const root=document.getElementById('cards'),all=sections.flatMap(s=>s.items);const search=document.getElementById('search'),chapterFilter=document.getElementById('chapterFilter'),reviewFilter=document.getElementById('reviewFilter');function filterCards(){const query=search.value.trim().toLocaleLowerCase('zh-CN');let visible=0;for(const s of sections){let shown=0;for(const item of s.items){const card=root.querySelector('[data-id="'+item[0]+'"]');if(!card)continue;const match=(!query||(item[0]+' '+item[1]).toLocaleLowerCase('zh-CN').includes(query))&&(chapterFilter.value==='all'||chapterFilter.value===s.section)&&(reviewFilter.value==='all'||(reviewFilter.value==='done'?done.has(item[0]):!done.has(item[0])));card.hidden=!match;if(match){visible++;shown++}}const heading=root.querySelector('[data-section="'+s.section+'"]');if(heading)heading.hidden=shown===0}document.getElementById('visibleCount').textContent='当前显示 '+visible+' / '+all.length+' 道题';document.getElementById('empty').hidden=visible!==0}for(const el of [search,chapterFilter,reviewFilter])el.addEventListener('input',filterCards);function save(){try{localStorage.setItem(key,JSON.stringify([...done]))}catch(e){}}function refresh(){document.getElementById('summary').textContent='本机已复习 '+done.size+' / '+all.length+' 道题（仅表示已查看，不代表已答对）';for(const el of root.children)el.classList.toggle('done',done.has(el.dataset.id));filterCards()}for(const s of sections){const heading=document.createElement('h2');heading.textContent=s.section+' · '+s.title;heading.dataset.section=s.section;heading.style.gridColumn='1/-1';root.append(heading);for(const [id,description] of s.items){const card=document.createElement('article');card.className='card';card.dataset.id=id;const title=document.createElement('h3');title.textContent=id;const desc=document.createElement('p');desc.textContent=description;const note=document.createElement('p');note.className='muted';note.textContent='独立编写的练习提示；请对照教材原题作图。';const button=document.createElement('button');button.type='button';button.onclick=()=>{if(done.has(id))done.delete(id);else done.add(id);save();refresh()};button.textContent='切换已复习标记';card.append(title,desc,note,button);root.append(card)}}document.getElementById('reset').onclick=()=>{if(!confirm('确定清除本机的章节复习标记？'))return;done.clear();save();refresh()};refresh()})();
</script></body></html>
