<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>章节作图练习 | 图学课堂</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;background:#eef4ef;color:#20382d}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #d8e5dc;border-radius:16px;padding:18px;margin:14px 0}h1{font-size:clamp(22px,4vw,32px)}p{line-height:1.7}a{color:#206b55}button,select{font:inherit;border:1px solid #b5cebf;background:#fff;border-radius:9px;padding:10px;min-height:44px;cursor:pointer}button.active{background:#206b55;color:white}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sheet{overflow:auto;touch-action:pan-x pan-y;border:1px solid #d7e5dc;border-radius:12px;background:#fff}.sheet svg{display:block;width:100%;min-width:600px;touch-action:none;user-select:none}.notice{border-left:4px solid #c68c36;background:#fff8eb;padding:12px;border-radius:7px}.hint{color:#506c5b}.key{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}.key span:first-child{color:#1e5c4b}.key span:nth-child(2){color:#b16b26}.muted{color:#667c6f;font-size:13px}button:focus-visible,select:focus-visible{outline:3px solid #e5a543}
.source-line{transition:opacity .24s ease}#lineFocus .focus-end{fill:#fff;stroke:#d18b37;stroke-width:2.5}.source-line.hidden-step,.source-detail.hidden-step{opacity:0;visibility:hidden}.source-line.new-step{stroke:#d18b37!important;stroke-width:3.5!important}#revealRange{accent-color:#206b55;min-width:130px;flex:1;max-width:300px}@media(prefers-reduced-motion:reduce){.source-line{transition:none}}#drawingTools[hidden]{display:none!important}#ink[hidden]{display:none!important}.dof-row{padding:10px 12px;border-radius:9px;background:#f1f7f3;margin:8px 0}.dof-row strong{color:#206b55}#guideWhy{line-height:1.9}#guides line{stroke:#b2742b;stroke-width:2.5;stroke-dasharray:8 5}#guides circle{fill:#c78c39}#guides text{font-size:16px;fill:#9b6226}</style></head><body><main class="wrap"><p><a href="chapter-26-29.html">← 返回章节题库</a></p><section class="card"><h1 id="title">章节作图练习</h1><p id="description"></p><p id="sourceStatus" class="muted" aria-live="polite"></p><p id="sourceAudit" class="notice" aria-live="polite" hidden></p><p class="notice" id="fidelity">已核对题目仅显示可辨认的教材已知线条；未核实题目不显示替代图。扫描中的透印和阴影不会用于生成几何线条。</p><div class="toolbar"><label for="question">选择题号</label><select id="question"></select><label class="hint"><input id="drawingToggle" type="checkbox"/> 开启自由作图</label></div><div class="toolbar" id="drawingTools" hidden><button id="pen" class="active" aria-pressed="true">画线</button><button id="eraser" aria-pressed="false">橡皮擦（点击线条）</button><button id="undo">撤销</button><button id="clear">清空画线</button><button id="grid" aria-pressed="false">网格：关</button></div><p class="hint" id="instructions">默认仅查看原题与步骤，不会新增点线。开启自由作图后才可使用手指或手写笔画线，笔迹仅保存在当前浏览器。</p><div class="toolbar" id="revealControls"><button type="button" id="revealPrev">上一步</button><button type="button" id="revealNext">下一步</button><button type="button" id="revealAll">显示全部已核实解题步骤</button><label for="revealRange">解题步骤</label><input id="revealRange" type="range" min="0" max="1" value="1" aria-label="已核对线条显示进度"/><span id="revealStatus" aria-live="polite"></span></div><p id="revealWhy" class="hint" aria-live="polite"></p><p class="muted">第一帧完整展示已核对的原题已知条件；之后仅逐步添加经过核实的辅助线、求作点与答案线。未核实的解题步骤不播放。</p><div class="sheet"><svg id="board" viewBox="0 0 960 520" role="img" aria-label="可绘制线条的三视图练习纸"><g id="background"></g><g id="lineFocus" pointer-events="none"></g><g id="ink" hidden></g><g id="guides" pointer-events="none"></g></svg></div><div class="key"><span>深绿色：已核对的原题已知轮廓</span><span>橙色：已核实的解题步骤／自由作图笔迹</span><span>浅灰色：辅助网格（不是扫描透印）</span></div><p class="muted" id="status" aria-live="polite"></p><section class="card" aria-label="自由度与辅助线原理"><h2>自由度分析 · 为什么这样画辅助线</h2><p class="muted">按投影几何关系分析。当前多数题目仍是通用示意，不代表已根据教材原图求出唯一答案。</p><div id="dofPanel" aria-live="polite"></div><div class="toolbar"><button id="guidePrev" type="button">上一个原理</button><button id="guideNext" type="button">下一个原理</button><button id="guideShow" type="button" aria-pressed="false">显示原理辅助线</button></div><h3 id="guideTitle"></h3><p id="guideWhy"></p><p id="guideLimit" class="muted"></p></section></section></main><script src="verified-exercises.js"></script><script src="chapter-dof.js"></script><script src="chapter-drawing.js"></script></body></html>
