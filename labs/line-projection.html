</style></head><body><main class="wrap"><p><a href="../index.html">← 返回图学课堂</a></p><h1>直线的投影 · 交互习题</h1><p class="muted">对应教材 2-5-1～2-5-8 的知识点与投影关系，采用重新绘制的可编辑示意图。拖动空间点 A/B（第 4 题为 G/K），三面投影自动同步。不是教材原图的毫米级描摹。</p>
