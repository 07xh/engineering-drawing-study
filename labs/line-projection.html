<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直线投影工作台 | 图学课堂</title><style>

ng:12px}.tasks{grid-template-columns:repeat(2,minmax(0,1fr))}.fields{grid-template-columns:1fr}.drawing svg{min-width:560px}.toolbar button{flex:1}h1{font-size:1.5rem}}
.wrap{max-width:1600px;padding:12px}.workbench{display:grid;grid-template-columns:180px minmax(0,1fr) 290px;gap:12px;align-items:start}.workbench .card{min-width:0;margin:0;padding:12px}.workbench-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:0 0 12px}.workbench-header h1{font-size:23px;margin:0}.workbench-header p{margin:0}.mode-tabs{display:flex;flex-wrap:wrap;gap:6px}.mode-tabs button[aria-pressed="true"]{background:#206c58;color:white}.task-card,.teach-card{position:sticky;top:12px;max-height:calc(100dvh - 24px);overflow:auto}.task-card .tasks{grid-template-columns:repeat(2,minmax(0,1fr))}.task-card .tasks button{font-size:12px;padding:6px 2px;min-height:38px}.task-card h2,.teach-card h2{font-size:16px}.task-card h3,.teach-card h3{font-size:14px}.task-card p,.teach-card{font-size:13px}.teach-card .fields{grid-template-columns:1fr}.paper-card .drawing{max-height:calc(100dvh - 280px);overflow:auto}.paper-card svg{min-width:0;min-height:330px}.paper-card .toolbar{gap:6px}.paper-card .toolbar button{font-size:13px;min-height:38px;padding:6px 9px}.paper-card .steps{margin:8px 0}.paper-card .steps button{min-height:34px;font-size:12px;padding:6px}.paper-card .step-note,.paper-card .practice-note{margin:7px 0;padding:9px;font-size:13px}.paper-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.paper-head h2{font-size:17px;margin:0}.workbench.mode-practice{grid-template-columns:150px minmax(0,1fr)}.workbench.mode-practice .teach-card{display:none}.workbench.mode-teaching{grid-template-columns:150px minmax(0,1fr) 330px}.workbench.mode-analysis{grid-template-columns:150px minmax(0,1fr) 360px}.workbench.mode-teaching #dofAnalysis{display:none}.workbench.mode-analysis #solution{display:none}.workbench.hide-sidebar .task-card{display:none}.workbench.hide-sidebar{grid-template-columns:minmax(0,1fr) 290px}.workbench.hide-sidebar.mode-practice{grid-template-columns:minmax(0,1fr)}.paper-card:fullscreen{background:white;padding:16px;overflow:auto}.paper-card:fullscreen .drawing{max-height:calc(100dvh - 230px)}@media(max-width:1080px){.workbench,.workbench.mode-teaching,.workbench.mode-analysis{grid-template-columns:145px minmax(0,1fr)}.teach-card{grid-column:2;position:static;max-height:none}.workbench.hide-sidebar,.workbench.hide-sidebar.mode-teaching,.workbench.hide-sidebar.mode-analysis{grid-template-columns:minmax(0,1fr)}.workbench.hide-sidebar .teach-card{grid-column:1}}@media(max-width:700px){.wrap{padding:8px}.workbench,.workbench.mode-practice,.workbench.mode-teaching,.workbench.mode-analysis,.workbench.hide-sidebar{display:flex;flex-direction:column}.workbench .card{width:100%}.task-card,.teach-card{position:static;max-height:none}.task-card .tasks{grid-template-columns:repeat(4,minmax(0,1fr))}.workbench.mode-practice .task-card{display:none}.paper-card .drawing{max-height:none}.paper-card svg{min-width:520px;min-height:275px}.mode-tabs button{flex:1}.paper-card .toolbar button{flex:1}.paper-card .steps{flex-wrap:nowrap;overflow:auto}.paper-card .steps button{flex:0 0 auto}}</style></head><body><main class="wrap"><header class="workbench-header"><div><p><a href="../index.html">← 返回图学课堂</a></p><h1>直线投影 · 作图工作台</h1><p class="muted">标准 V/H/W 同纸展开 · 教材 2-5-1～2-5-8</p></div><nav class="mode-tabs" aria-label="布局模式"><button data-layout="practice" aria-pressed="true">专注作图</button><button data-layout="teaching" aria-pressed="false">教材讲解</button><button data-layout="analysis" aria-pressed="false">自由度分析</button></nav></header><div class="workbench mode-practice" id="workbench"><aside class="card task-card" id="taskPanel"><h2>习题目录</h2><div class="tasks" id="tasks"></div><h3 id="questionTitle"></h3><p id="questionText"></p><p class="muted" id="questionHint"></p></aside><section class="card paper-card" id="paperPanel"><div class="paper-head"><h2>标准三面投影图纸</h2><div class="toolbar"><button id="sidebarToggle" aria-expanded="true" aria-controls="taskPanel">隐藏目录</button><button id="zoomOut">−</button><button id="zoomReset">100%</button><button id="zoomIn">＋</button><button id="paperFullscreen">全屏图纸</button></div></div><p class="key">V 左上 · H 左下 · W 右上。绿色为投影，金色为辅助线或学生作答。</p><div class="toolbar"><button id="practiceToggle" class="primary" aria-pressed="false">进入补图练习</button><button id="checkPractice" disabled>检查补图</button><button id="practiceHint" disabled>分步提示</button><button id="revealPractice" disabled>显示正确投影</button><button id="reset">恢复本题初始图</button><button id="guides" class="active" aria-pressed="true">显示投影联系线</button><button id="transfer45" class="active" aria-pressed="true">45° 转移线：开</button><button id="answer">显示判断与作图步骤</button><button id="random">换一组几何尺寸</button></div><div class="steps" id="drawingSteps" aria-label="分步作图"><button data-step="0">① 条件</button><button data-step="1">② 正面</button><button data-step="2">③ 水平</button><button data-step="3">④ 侧面</button><button data-step="4">⑤ 核对</button></div><div id="stepNote" class="step-note" aria-live="polite"></div><p class="practice-note" id="practiceInfo" aria-live="polite">进入补图练习后，在缺失视图区依次点击两个端点。</p><div class="drawing"><svg id="board" viewBox="0 0 960 510" role="img" aria-label="标准第一角 V H W 同纸投影图"></svg></div><p class="muted" id="status" aria-live="polite"></p></section><aside class="card teach-card" id="teachingPanel"><h2>智能教学</h2><h3>几何判断</h3><div class="info" id="diagnosis"></div><h3>自由度分析</h3><div class="dof" id="dofAnalysis" aria-live="polite"></div><h3>坐标调整</h3><div class="fields" id="fields"></div><h3>答案与步骤</h3><div class="answer hidden" id="solution"></div></aside></div></main><script src="constraint-engine.js"></script><script src="line-projection.js"></script><script src="line-workbench-layout.js"></script></body></html>
