<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双点三面投影 · DraftAI</title><link rel="stylesheet" href="../site-ui.css"><style>body{font-family:system-ui,sans-serif;max-width:960px;margin:auto;padding:16px;color:#234}fieldset{border:1px solid #ccd;border-radius:12px;margin:12px 0;padding:12px}input{width:75px;max-width:23%;padding:10px;font-size:16px}button,select{padding:12px;min-height:44px;margin:4px}svg{width:100%;height:auto;border:1px solid #ccd;touch-action:pan-x pan-y}svg [data-action]{stroke-width:8;cursor:pointer}#status{min-height:2em}label{display:inline-block;margin:6px} @media(max-width:550px){input{width:65px}button{margin:3px}}</style></head><body><a href="../index.html">← 返回首页</a><h1>双点三面投影 · V5 原题预验收</h1><p>请先根据原题图核对 A、B 坐标。此页面不进行图片 OCR，确认前不生成作图。</p><fieldset><legend>A 点 (mm)</legend><label>X <input id="ax" type="number" value="15"></label><label>Y <input id="ay" type="number" value="27"></label><label>Z <input id="az" type="number" value="30"></label></fieldset><fieldset><legend>B 点 (mm)</legend><label>X <input id="bx" type="number" value="30"></label><label>Y <input id="by" type="number" value="0"></label><label>Z <input id="bz" type="number" value="23"></label></fieldset><label><input id="confirmed" type="checkbox" style="width:auto"> 我已对照原题核对全部坐标，单位为 mm</label><div><button id="solve">确认并计算</button><button id="previous">上一步</button><button id="next">下一步</button><button id="play">播放/暂停</button><label>速度 <select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label></div><p id="status" role="status" aria-live="polite">等待确认原题条件。</p><p id="picked" role="status">点击辅助线可查看步骤。</p><svg id="sheet" viewBox="0 0 720 470" aria-label="双点三面投影作图画纸"></svg><p>这是公开预验收页面，尚未完成原书无答案盲测或 Android 真机验收。</p><script defer src="two-point-v5-live-bundle.js"></script></body></html>
